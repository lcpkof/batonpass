[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batonpass"
version = "0.0.1"
description = "Never drop the baton. Read-only inventory of the AI history on your machine, and a handoff you can carry to the next one."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

keywords = ["ai", "agent", "transcript", "handoff", "memory", "cli", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/lcpkof/batonpass"
Issues = "https://github.com/lcpkof/batonpass/issues"

[project.scripts]
batonpass = "discover:main"

[tool.setuptools]
py-modules = ["discover"]
